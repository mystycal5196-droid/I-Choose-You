<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Choose You 💖</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  background:radial-gradient(circle at top,#ff9fcf,#1a0614);
  overflow:hidden;
  font-family:"Trebuchet MS", system-ui, sans-serif;
  color:white;
}

/* ---------- ANIMATIONS ---------- */
@keyframes floatUp{from{transform:translateY(0)}to{transform:translateY(-120vh)}}
@keyframes pulse{0%{box-shadow:0 0 25px hotpink}50%{box-shadow:0 0 60px pink}}
@keyframes openTop{to{transform:rotateX(120deg)}}
@keyframes rise{from{transform:translate(-50%,40px)}to{transform:translate(-50%,-180px)}}
@keyframes sparkleFade{from{opacity:1}to{opacity:0;transform:translateY(-40px)}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

/* ---------- SOFT CLOUDS ---------- */
.cloud{
  position:absolute;
  width:320px;
  height:120px;
  background:rgba(255,180,210,.35);
  border-radius:100px;
  filter:blur(35px);
  animation:drift linear infinite;
  pointer-events:none;
}

/* ---------- FLOATING HEARTS ---------- */
.heart{
  position:absolute;
  bottom:-40px;
  animation:floatUp linear infinite;
  opacity:.7;
}

/* ---------- START ---------- */
.center{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.gate{
  display:flex;
  gap:40px;
  margin-top:30px;
}

.door{
  width:140px;
  height:220px;
  border-radius:16px;
  background:linear-gradient(#fff,#ffd6eb);
  color:#1a0614;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 0 30px rgba(255,255,255,.7);
}

/* ---------- WORLD ---------- */
#worldView{
  display:none;
  width:100vw;
  height:100vh;
  position:relative;
}

.world{
  position:absolute;
  top:50%;left:50%;
  width:220px;height:220px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:url("her.jpg") center/cover no-repeat;
  border:4px solid rgba(255,255,255,.6);
  animation:pulse 3s infinite;
}

/* ---------- POKEBALL ---------- */
#pokeball{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:100px;height:100px;
  cursor:pointer;
  z-index:5;
}

.ball-top,.ball-bottom{
  width:100%;
  height:50%;
  position:absolute;
}

.ball-top{
  background:red;
  border:4px solid black;
  border-bottom:none;
  border-radius:100px 100px 0 0;
  transform-origin:bottom;
}

.ball-bottom{
  bottom:0;
  background:white;
  border:4px solid black;
  border-top:none;
  border-radius:0 0 100px 100px;
}

/* ---------- JIRACHI ---------- */
#jirachi{
  display:none;
  position:absolute;
  top:50%;left:50%;
  width:130px;
  transform:translate(-50%,40px);
  animation:rise 2.5s ease forwards;
  z-index:6;
}

/* ---------- DIALOGUE ---------- */
.dialogueBox{
  position:absolute;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  background:#f8f8f8;
  color:#000;
  border:4px solid #333;
  border-radius:14px;
  padding:18px 22px;
  width:82%;
  max-width:520px;
  font-family:"Courier New", monospace;
  z-index:15;
  display:none;
}

/* ---------- CORNER HEARTS ---------- */
.corner-heart{
  position:fixed;
  font-size:52px;
  cursor:pointer;
  animation:pulse 2.5s infinite;
  display:none;
  z-index:10;
}

.corner-heart.clicked{
  color:gold;
  filter:drop-shadow(0 0 12px gold);
}

.top-left{top:18px;left:18px}
.top-right{top:18px;right:18px}
.bottom-left{bottom:18px;left:18px}
.bottom-right{bottom:18px;right:18px}

.corner-heart span{
  display:block;
  font-size:14px;
}

/* ---------- TYPE BADGES ---------- */
.type{
  display:inline-block;
  padding:4px 10px;
  border-radius:12px;
  color:white;
  font-size:12px;
  margin-bottom:10px;
  font-weight:bold;
}
.fairy{background:#f4a6c8}
.psychic{background:#f85888}
.electric{background:#f8d030;color:black}
.normal{background:#a8a878}

/* ---------- MODALS ---------- */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  align-items:center;
  justify-content:center;
  z-index:25;
}

.modalContent{
  background:#f8f8f8;
  color:black;
  padding:22px;
  border-radius:16px;
  max-width:420px;
  border:4px solid #333;
  font-family:"Courier New", monospace;
  text-align:center;
}

.modalContent img{
  width:100%;
  border-radius:14px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<!-- CLOUDS -->
<script>
for(let i=0;i<6;i++){
  const c=document.createElement("div");
  c.className="cloud";
  c.style.top=Math.random()*70+"vh";
  c.style.animationDuration=60+Math.random()*40+"s";
  document.body.appendChild(c);
}
</script>

<div class="center" id="startScreen">
  <h1>Hey Ans 💖</h1>
  <p>I have something special for you.</p>
  <div class="gate">
    <div class="door" onclick="accept()">YES</div>
    <div class="door" id="noDoor">NO</div>
  </div>
</div>

<div id="worldView">
  <div class="world"></div>

  <div id="pokeball" onclick="openBall()">
    <div class="ball-top" id="ballTop"></div>
    <div class="ball-bottom"></div>
  </div>

  <img id="jirachi" src="jirachi.png">

  <div class="dialogueBox" id="dialogue"></div>

  <div class="corner-heart top-left" onclick="openCorner(0,this)">💖<span>hit me!</span></div>
  <div class="corner-heart top-right" onclick="openCorner(1,this)">💖<span>hit me!</span></div>
  <div class="corner-heart bottom-left" onclick="openCorner(2,this)">💖<span>hit me!</span></div>
  <div class="corner-heart bottom-right" onclick="openCorner(3,this)">💖<span>hit me!</span></div>

  <div id="wildLuke" class="dialogueBox" style="top:40%;bottom:auto;display:none;cursor:pointer"
       onclick="openFinal()">A wild Luke approaches!<br>(click me)</div>
</div>

<!-- PHOTO MODAL -->
<div class="modal" id="cornerModal">
  <div class="modalContent">
    <div id="cornerType"></div>
    <img id="cornerImg">
    <p id="cornerCaption"></p>
    <div style="opacity:.7;cursor:pointer" onclick="closeCorner()">close</div>
  </div>
</div>

<!-- FINAL MODAL -->
<div class="modal" id="finalModal">
  <div class="modalContent" id="finalText"></div>
</div>

<audio id="music" src="song.mp3"></audio>
<audio id="battle" src="pokemon_battle.mp3"></audio>

<script>
/* FLOATING HEARTS */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerText=Math.random()>.5?"💖":"💙";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=16+Math.random()*22+"px";
  h.style.animationDuration=6+Math.random()*6+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),12000);
},220);

/* NO DOOR RUNS */
noDoor.onmouseover=()=>{
  noDoor.style.position="absolute";
  noDoor.style.left=Math.random()*80+"vw";
  noDoor.style.top=Math.random()*80+"vh";
};

/* ACCEPT */
function accept(){
  music.play();
  startScreen.style.display="none";
  worldView.style.display="block";
}

/* OPEN BALL */
function openBall(){
  ballTop.style.animation="openTop 1s forwards";
  setTimeout(()=>{
    pokeball.style.display="none";
    releaseJirachi();
  },900);
}

/* TYPE TEXT */
function typeText(el,text,speed=35){
  el.innerHTML="";
  let i=0;
  const t=setInterval(()=>{
    el.innerHTML+=text[i++];
    if(i>=text.length) clearInterval(t);
  },speed);
}

/* JIRACHI */
function releaseJirachi(){
  jirachi.style.display="block";
  setTimeout(()=>{
    dialogue.style.display="block";
    typeText(dialogue,
      "⭐ I WISH you much love and care,\nbecause Ansley…\nI choose you. 💙"
    );
    document.querySelectorAll(".corner-heart")
      .forEach(h=>h.style.display="block");
  },2500);
}

/* HEARTS + MODAL */
let hearts=0;
const cornerMemories=[
  {img:"corner1.jpg",text:"One of my favorite moments.",type:"Fairy",cls:"fairy"},
  {img:"corner2.jpg",text:"This is when I knew.",type:"Psychic",cls:"psychic"},
  {img:"corner3.jpg",text:"You make everything brighter.",type:"Electric",cls:"electric"},
  {img:"corner4.jpg",text:"Forever my favorite person.",type:"Normal",cls:"normal"}
];

function openCorner(i,el){
  if(!el.classList.contains("clicked")){
    el.classList.add("clicked");
    hearts++;
    if(hearts===4){
      wildLuke.style.display="block";
    }
  }
  cornerType.innerHTML=`<span class="type ${cornerMemories[i].cls}">${cornerMemories[i].type}</span>`;
  cornerImg.src=cornerMemories[i].img;
  cornerCaption.innerText=cornerMemories[i].text;
  cornerModal.style.display="flex";
}

function closeCorner(){
  cornerModal.style.display="none";
}

/* FINAL */
function openFinal(){
  wildLuke.style.display="none";
  battle.play();
  finalModal.style.display="flex";
  typeText(finalText,
    "Ansley,\n\nYou are my favorite encounter.\nNo rerolls. No resets.\nI choose you — always. 💖"
  );
}
</script>

</body>
</html>
